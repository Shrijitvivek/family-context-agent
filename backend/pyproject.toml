[project]
name = "family-context-agent"
version = "0.1.0"
description = "NVIDIA hackathon MVP for coordinated household context."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
