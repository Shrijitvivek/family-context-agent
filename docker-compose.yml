services:
  db:
    image: postgres:16
    container_name: family-context-db
    environment:
      POSTGRES_DB: family_context_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_context_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-context-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/family_context_agent
      NEBIUS_API_KEY: ${NEBIUS_API_KEY}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL}
      NVIDIA_MODEL_NAME: ${NVIDIA_MODEL_NAME}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: